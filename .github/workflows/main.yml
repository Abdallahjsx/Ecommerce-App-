name: Build & Deploy Next.js Static Export to MonsterASP.NET
on:
  push:
    branches:
      - staging
jobs:
  build_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build and Export Next.js
        run: npm run build
        
      - name: Prepare publish folder
        shell: cmd
        run: |
          echo 📦 Preparing static export for deployment...
          if exist publish rd /s /q publish
          mkdir publish
          if exist out (
            xcopy /E /I /Y "out" publish
          ) else (
            echo ❌ Error: out directory not found
            exit 1
          )
          
      - name: Deploy via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: publish
